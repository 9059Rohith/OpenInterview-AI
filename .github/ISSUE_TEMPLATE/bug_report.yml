name: Bug report
description: Report a reproducible problem without private data.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Do not include keys, resumes, recordings or private transcripts.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps and environment
      description: Include web/desktop, OS, version and provider category without credentials.
    validations:
      required: true
