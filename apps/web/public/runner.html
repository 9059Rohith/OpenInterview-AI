<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'none'"><title>Isolated code runner</title></head><body><script>
window.addEventListener('message', function(event) {

  worker.postMessage({code:event.data.code, tests:event.data.tests});
